[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "invrs-wakis"
version = "0.1.0"
description = "Wakis FIT time-domain backend (with exact discrete adjoint) for the invrs-gym photonic inverse-design challenges"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Wakis develop (eshipton fork) at the commit this package was tested with
    "wakis @ git+https://github.com/eshipton/Wakis.git@b77b8b8154a5deba25f8ba1cad43b4752cfbe600",
    "invrs-gym>=1.6.2",
    "invrs-opt>=0.12",
    "imageruler>=0.3",
    # imageruler needs cv2; the headless wheel avoids libGL (Batch containers)
    "opencv-python-headless",
    "jax>=0.4.30",
    "numpy",
    "scipy",
    "matplotlib",
    "optax",
]

[tool.uv]
# Never install the GUI OpenCV wheel (needs libGL); opencv-python-headless
# provides the same cv2 module
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: long-running tests (minutes)"]
testpaths = ["tests"]
